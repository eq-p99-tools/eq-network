[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/eq-p99-tools/eq-network"

[workspace.dependencies]
anyhow = "1"
cbc = "0.1"
cipher = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crc32fast = "1"
des = "0.8"
hex = "0.4"
md5 = "0.7"
miniz_oxide = "0.8"
num-bigint = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
