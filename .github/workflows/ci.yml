name: CI

# The full suite runs only on demand (Actions > CI > Run workflow), at milestones.
# Pull requests and main run Lint; contributors run these checks locally.
# Temporary while development is heavy: the full suite returns to pull requests later.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Validation platform (Linux is an explicit deferred sweep)
        type: choice
        default: windows
        options:
          - windows
          - linux
      toolchain:
        description: Rust toolchain (1.99.0 is the routine minimum; stable is opt-in)
        required: false
        default: '1.99.0'
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: inputs.platform == 'linux'
    name: Lint, test, and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain || '1.99.0' }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --workspace --all-targets --all-features
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  windows:
    if: inputs.platform != 'linux'
    name: Native Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain || '1.99.0' }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo test --workspace --all-targets --all-features
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
