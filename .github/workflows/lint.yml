name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  dependencies:
    name: Dependency policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: taiki-e/install-action@v2
        with:
          # Match the version in cargo-deny-action@v2's Docker image.
          tool: cargo-deny@0.22.1
          fallback: none
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check
